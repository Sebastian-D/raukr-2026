# Keep this file ASCII-only: read_brand_yml() can fail under a C/POSIX locale.
meta:
  name: RaukR 2026 - Quarto

color:
  palette:
    teal: "#4C979F"
    teal-light: "#A6CBCF"
    teal-lighter: "#D1E5E6"
    link-teal: "#33666B"   # WCAG AA on white and code backgrounds.
    ink: "#1c2833"
    code-blue: "#496985"
  primary: teal
  # Use an AA-safe value because Quarto also applies secondary to muted text.
  secondary: link-teal
  foreground: ink
  background: "#ffffff"
  # Link color belongs under typography.link. Brand color roles have no link key.

typography:
  fonts:
    - family: Albert Sans
      source: google
      weight: [400, 600, 700]
    - family: Fira Mono
      source: google
      weight: [400, 500]
  base:
    family: Albert Sans
    line-height: 1.5
  headings:
    family: Albert Sans
    weight: 600
  monospace:
    family: Fira Mono
  link:
    color: link-teal
